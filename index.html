<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chat-viewer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section id="home" class="screen">
    <header class="home-header">
      <h1>Chats</h1>
      <button id="add-file-btn" type="button" title="Add file" aria-label="Add file">+</button>
    </header>
    <div id="chat-list" class="chat-list" role="list"></div>
    <p id="empty-hint" class="empty-hint" hidden>
      No conversations yet. Tap + and choose a chat export (.txt).
    </p>
    <div id="toast" class="toast" role="alert" hidden></div>
    <footer id="home-note" class="home-note" hidden></footer>
    <input id="file-input" type="file" multiple accept=".txt" hidden>
  </section>

  <section id="chat" class="screen chat-screen" hidden>
    <header class="chat-header">
      <!-- RTL layout: element order runs right-to-left, so the back button
           (first child) sits on the visual right, the start side. The arrow
           glyph points toward start (right) to match Arabic back-nav. -->
      <button id="chat-back-btn" class="chat-btn" type="button" aria-label="رجوع" title="رجوع">→</button>
      <span class="chat-spacer"></span>
      <!-- SEARCH BUTTON SEAM: Task 9 opens the search overlay on this click.
           Task 8 (js/ui/chat.js) leaves this handler a deliberate no-op. -->
      <button id="chat-search-btn" class="chat-btn" type="button" aria-label="بحث" title="بحث">🔍</button>
    </header>
    <div class="chat-body">
      <!-- Virtualized scroll area: [padTop][rendered bubble pool][padBottom].
           js/ui/chat.js sizes the pads and fills #chat-pool per scroll frame. -->
      <div id="chat-scroll" class="chat-scroll">
        <div id="chat-pad-top" class="chat-pad"></div>
        <div id="chat-pool" class="chat-pool"></div>
        <div id="chat-pad-bottom" class="chat-pad"></div>
      </div>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
