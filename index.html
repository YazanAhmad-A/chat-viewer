<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chat-viewer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section id="home" class="screen">
    <header class="home-header">
      <h1>Chats</h1>
      <button id="add-file-btn" type="button" title="Add file" aria-label="Add file">+</button>
    </header>
    <div id="chat-list" class="chat-list" role="list"></div>
    <p id="empty-hint" class="empty-hint" hidden>
      No conversations yet. Tap + and choose a chat export (.txt).
    </p>
    <div id="toast" class="toast" role="alert" hidden></div>
    <footer id="home-note" class="home-note" hidden></footer>
    <input id="file-input" type="file" multiple accept=".txt" hidden>
  </section>

  <section id="chat" class="screen" hidden>
    <!-- Chat screen is rendered by a later task. -->
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
